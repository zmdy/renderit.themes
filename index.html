    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0F1115',
            surface: '#16191E',
            panel: '#1E2228',
            border: '#2A2F37',
            accent: '#3B82F6',
            'accent-dim': 'rgba(59, 130, 246, 0.1)',
            text: '#E2E8F0',
            'text-dim': '#94A3B8'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }

  <style>
    body {
      background-color: #0F1115;
      color: #E2E8F0;
    }

    .glass {
      background: rgba(22, 25, 30, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .addon-item.active {
      background: rgba(59, 130, 246, 0.1);
      border-color: rgba(59, 130, 246, 0.3);
      color: #3B82F6;
    }

    /* PREVIEW SCOPING & ISOLATION */
    #preview-area {
      background: #f8fafc;
      min-height: 400px;
      position: relative;
      color: #1f2937;
      /* Default light theme text */
      text-align: left;
    }

    /* Reset styles inside preview to prevent leakage from showcase */
    .renderit-preview-scope {
      display: block;
      position: relative;
      padding: 40px;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      /* Soft reset: allow global fonts and variables but isolate layout */
      color: #1f2937;
      line-height: 1.5;
      font-size: 16px;
    }

    .renderit-preview-scope * {
      box-sizing: border-box;
    }

    /* Re-enable important things */
    .renderit-preview-scope script,
    .renderit-preview-scope style {
      display: none;
    }

    /* Prevent fixed/floating addons from escaping the preview wrapper in showcase mode */
    #preview-root [style*="position: fixed"],
    #preview-root .pos-fixed,
    #preview-root .renderit-cookie-banner-wrap,
    #preview-root .renderit-whatsapp-container,
    #preview-root [class*="pos-bottom-"],
    #preview-root [class*="pos-top-"] {
      position: absolute !important;
    }
  </style>
</head>

          <i class="fa-solid fa-rotate text-[10px]"></i> Re-Run Scripts
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden bg-bg">

      <!-- Toolbar -->
      <div class="h-12 border-b border-border flex items-center justify-between px-6 bg-surface/30">
        <div class="flex items-center gap-4">

          <div id="addon-badge"

        </div>

        <div class="flex items-center gap-2">

        </div>
      </div>

      <!-- Content Split -->

        <!-- Left: Live Preview -->

            class="text-[11px] font-bold text-text-dim uppercase tracking-wider mb-3 flex items-center justify-between">
            <span>Direct Component Preview</span>

            </div>

        </div>

            </button>
          </div>
        </div>

      </div>
    </main>
  </div>

      rounded: { lg: '12px', md: '8px' },
      elevation: { md: '0 4px 6px -1px rgb(0 0 0 / 0.1)', lg: '0 10px 15px -3px rgb(0 0 0 / 0.1)' }
    };

    let currentAddon = null;

    // Helper: Scope CSS to the preview root
    function scopeCSS(css, scope) {
      if (!css) return '';
      // Simple regex to prefix rules, excluding media queries and @keyframes
      return css.replace(/([^\s{}][^{}]*)\{/g, (match, selector) => {
        const trimmedSelector = selector.trim();
        // Skip @rules and keyframe stages (digits or percentages)
        if (trimmedSelector.startsWith('@') || /^\d/.test(trimmedSelector)) return match;
        
        // Handle comma separated selectors
        const scopedSelector = selector.split(',').map(s => {
          const part = s.trim();
          if (!part) return '';
          if (part === ':root') return scope; 
          return `${scope} ${part}`;
        }).join(', ');
        
        return `${scopedSelector} {`;
      });
    }

    // Track injected scripts for cleanup
    let _injectedScripts = [];

    function cleanupPreviousScripts() {
      _injectedScripts.forEach(el => el.remove());
      _injectedScripts = [];
    }

    // Helper: Execute Scripts safely
    function executeScripts(container) {
      const scripts = container.querySelectorAll('script');
      scripts.forEach(oldScript => {
        oldScript.remove(); // Always remove from DOM first

        if (oldScript.src) {
          // External script: only inject if not already in head
          if (!document.querySelector(`script[src="${oldScript.src}"]`)) {
            const newScript = document.createElement('script');
            newScript.src = oldScript.src;
            newScript.dataset.injectedByShowcase = '1';
            document.head.appendChild(newScript);
            _injectedScripts.push(newScript);
          }
        } else {
          // Inline script: execute via new Function for isolation
          // This prevents ghost re-executions and scope pollution
          try {
            const fn = new Function(oldScript.innerHTML);
            fn();
          } catch (e) {
            console.error('[Showcase] Script execution error:', e);
          }
        }
      });
    }

    async function loadAddons() {
      const addons = [
        'accordion', 'animated-text-scramble', 'animated-text-split', 'comparison',
        'cookie-banner', 'countdown', 'countdown-event', 'counter', 'flipbox',
        'form', 'gallery', 'icon-list', 'logo-ticker', 'map', 'newsletter',
        'popup', 'pricing', 'slider', 'social-feed', 'stats', 'sticky-cta',
        'tabs', 'category-tabs', 'team', 'testimonials', 'timeline', 'video', 'whatsapp'
      ];

      const listContainer = document.getElementById('addon-list');
      listContainer.innerHTML = '';

      addons.forEach(name => {
        const div = document.createElement('div');
        div.className = 'addon-item group flex items-center justify-between px-3 py-2 rounded-md border border-transparent hover:bg-panel cursor-pointer transition-all';
        div.dataset.name = name;
        div.innerHTML = `
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-cube text-text-dim group-hover:text-accent text-[10px]"></i>
            <span class="text-[12px] font-medium capitalize">${name.replace(/-/g, ' ')}</span>
          </div>
        `;
        div.onclick = () => selectAddon(name);
        listContainer.appendChild(div);
      });
    }

    async function selectAddon(name) {
      currentAddon = name;
      document.querySelectorAll('.addon-item').forEach(el => el.classList.remove('active'));
      const activeItem = document.querySelector(`[data-name="${name}"]`);
      if (activeItem) activeItem.classList.add('active');

      document.getElementById('current-addon-name').textContent = name.replace(/-/g, ' ').toUpperCase();
      document.getElementById('addon-badge').classList.remove('hidden');

      const mock = addonMocks[name] || { items: [] };
      document.getElementById('json-editor').value = JSON.stringify(mock, null, 2);

      renderCurrentAddon();
    }

    async function renderCurrentAddon() {
      if (!currentAddon) return;
      const statusEl = document.getElementById('preview-status');
      statusEl.textContent = 'rendering...';

      try {
        const response = await fetch(`addons/${currentAddon}.html?t=${Date.now()}`);
        let html = await response.text();
        const data = JSON.parse(document.getElementById('json-editor').value);
        console.log('[Showcase] Data from Editor:', data);

        // Context with dynamic ID
        const context = {
          ...data,
          [currentAddon.replace(/-/g, '_')]: data,
          design: designContext,
          id: `pv-${Math.random().toString(36).substring(2, 6)}`
        };

        const resolve = (path, obj) => {
          if (!path || !obj) return undefined;
          return path.trim().split('.').reduce((acc, part) => acc && acc[part], obj);
        };

        function renderTemplate(content, ctx) {
          let result = content;

          // 1. Resolve FOREACH (Balanced Tag Matching)
          while (result.includes('%FOREACH')) {
            const startIdx = result.indexOf('%FOREACH');
            const pathMatch = result.substring(startIdx).match(/%FOREACH\s+([^%]+)%/);
            if (!pathMatch) break;

            const path = pathMatch[1].trim();
            const afterStart = startIdx + pathMatch[0].length;
            
            // Find matching %ENDFOREACH%
            let depth = 1;
            let currentPos = afterStart;
            let endIdx = -1;

            while (depth > 0 && currentPos < result.length) {
              const nextOpen = result.indexOf('%FOREACH', currentPos);
              const nextClose = result.indexOf('%ENDFOREACH%', currentPos);

              if (nextClose === -1) break;

              if (nextOpen !== -1 && nextOpen < nextClose) {
                depth++;
                currentPos = nextOpen + 8;
              } else {
                depth--;
                endIdx = nextClose;
                currentPos = nextClose + 12;
              }
            }

            if (endIdx === -1) break;

            const innerContent = result.substring(afterStart, endIdx);
            const items = resolve(path, ctx);
            
            let renderedItems = '';
            if (Array.isArray(items)) {
              renderedItems = items.map((item, idx) => {
                const itemCtx = { ...ctx, ...item, INDEX: idx, FIRST: idx === 0 ? "true" : "false", LAST: idx === items.length - 1 ? "true" : "false" };
                return renderTemplate(innerContent, itemCtx);
              }).join('');
            }

            result = result.substring(0, startIdx) + renderedItems + result.substring(endIdx + 12);
          }

          // 2. Resolve IFs (Recursive)
          let prevResult;
          let pass = 0;
          do {
            prevResult = result;
            result = result.replace(/%IF\s+([^%]+)%((?:(?!%IF)[\s\S])*?)%ENDIF%/g, (match, path, inner) => {
              const val = resolve(path, ctx);
              if (inner.includes('%ELSE%')) {
                const parts = inner.split('%ELSE%');
                return (val && val !== "false" && val !== "undefined") ? parts[0] : parts[1];
              }
              return (val && val !== "false" && val !== "undefined") ? inner : '';
            });
          } while (result !== prevResult && pass++ < 10);

          // 3. Resolve Variables
          return result.replace(/%((?!IF |ENDIF|ELSE|FOREACH|ENDFOREACH)[^%]+)%/g, (m, p) => {
            const val = resolve(p, ctx);
            if (val === undefined) return m;
            return typeof val === 'object' ? JSON.stringify(val) : val;
          });
        }

        html = renderTemplate(html, context);

        // INJECTION LOGIC (NO IFRAME)
        const root = document.getElementById('preview-root');

        // Clean up previous runs (DOM + injected scripts)
        cleanupPreviousScripts();
        root.innerHTML = '';

        // Create a temporary container to parse the HTML
        const temp = document.createElement('div');
        temp.innerHTML = html;

        // Scope styles
        const styles = temp.querySelectorAll('style');
        styles.forEach(s => {
          s.innerHTML = scopeCSS(s.innerHTML, '#preview-root');
        });

        // Move to root
        root.appendChild(temp);

        // Execute scripts
        executeScripts(root);

        statusEl.textContent = 'ready';
        showToast('Renderizado com sucesso!');
      } catch (e) {
        console.error('Render failed', e);
        statusEl.textContent = 'error';
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
    }

    document.getElementById('btn-update-preview').onclick = renderCurrentAddon;
    document.getElementById('btn-refresh').onclick = renderCurrentAddon;

    document.getElementById('view-desktop').onclick = () => {
      document.getElementById('preview-wrapper').style.width = '100%';
      document.getElementById('view-desktop').classList.add('text-accent');
      document.getElementById('view-mobile').classList.remove('text-accent');
    };

    document.getElementById('view-mobile').onclick = () => {
      document.getElementById('preview-wrapper').style.width = '375px';
      document.getElementById('preview-wrapper').classList.add('mx-auto');
      document.getElementById('view-mobile').classList.add('text-accent');
      document.getElementById('view-desktop').classList.remove('text-accent');
    };

    document.getElementById('search-addons').oninput = (e) => {
      const q = e.target.value.toLowerCase();
      document.querySelectorAll('.addon-item').forEach(el => {
        el.style.display = el.dataset.name.toLowerCase().includes(q) ? 'flex' : 'none';
      });
    };

    loadAddons().then(() => selectAddon('stats'));
  </script>
</body>
