%PARTIAL partials/header.html%

<!-- Page Header -->
<div class="section theme-primary-bg" style="padding: 60px 0;">
  <div class="container">
    <div class="row">
      <div class="col s12 center-align">
        <h1 class="white-text" style="margin: 0;">Contato</h1>
        <p class="flow-text white-text" style="opacity: 0.9;">Estamos prontos para atender a sua empresa.</p>
      </div>
    </div>
  </div>
</div>

<div class="section theme-surface-bg" style="padding: 80px 0;">
  <div class="container">
    <div class="row">
      
      <!-- Formulário -->
      <div class="col s12 m6">
        <h3 class="theme-primary-text" style="margin-bottom: 30px;">Fale Conosco</h3>
        <div class="card-panel theme-neutral-bg" style="border-radius: %design.rounded.md%;">
          %ADDON form%
        </div>
      </div>

      <!-- Mapa e Informações -->
      <div class="col s12 m6">
        <h3 class="theme-primary-text" style="margin-bottom: 30px;">Nossa Sede</h3>
        
        <div style="border-radius: %design.rounded.md%; overflow: hidden; margin-bottom: 30px; box-shadow: 0 2px 2px 0 rgba(0,0,0,0.14);">
          <!-- Addon: Map (Ocupará 100% da largura da div pai) -->
          <div style="height: 400px; width: 100%;">
            %ADDON map%
          </div>
        </div>

        <div>
          <h5 class="theme-primary-text">Endereço Corporativo</h5>
          <p class="flow-text" style="font-size: 1.2rem;">%footer.address%</p>
        </div>
      </div>

    </div>
  </div>
</div>

%PARTIAL partials/footer.html%
