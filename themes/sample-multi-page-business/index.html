    <div class="row">
      <div class="col s12 m8 offset-m2 center-align">
        <h6 class="theme-primary-text" style="letter-spacing: 2px; text-transform: uppercase;">%hero.subtitle%</h6>
        <h1 style="margin-bottom: 30px;">%hero.title%</h1>
        <p class="flow-text" style="margin-bottom: 40px;">%hero.description%</p>
        <a href="sobre.html" class="btn-large waves-effect waves-light">Descubra Nossa História</a>
      </div>
    </div>
  </div>
</div>

<!-- Resumo da Empresa -->
<div class="section theme-surface-bg" style="padding: 80px 0;">
  <div class="container">
    <div class="row center-align">
      <div class="col s12">
        <h2 class="theme-primary-text">O Que Fazemos</h2>

          Nossa abordagem integra consultoria estratégica e execução técnica, criando soluções que transformam o mercado.
        </p>
      </div>
    </div>
  </div>
</div>

<!-- Evolução Resumida -->

      <div class="col s12 center-align" style="margin-bottom: 50px;">
        <h3>Nossa Evolução</h3>
      </div>
    </div>

    <div class="row">
      <div class="col s12">
        %ADDON timeline%
      </div>
    </div>
  </div>
</div>
