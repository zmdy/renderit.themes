<!-- Addon: testimonials -->
<section id="renderit-testimonials-%INDEX%" class="renderit-testimonials-section">
  <div class="renderit-testimonials-grid">
    %FOREACH testimonials.items%
    <div class="renderit-testimonial-card">
      <div class="renderit-testimonial-quote-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M14.017 21L14.017 18C14.017 16.8954 14.9124 16 16.017 16H19.017C19.5693 16 20.017 15.5523 20.017 15V9C20.017 8.44772 19.5693 8 19.017 8H16.017C15.4647 8 15.017 8.44772 15.017 9V12C15.017 12.5523 14.5693 13 14.017 13H13.017V21H14.017ZM6.017 21L6.017 18C6.017 16.8954 6.91243 16 8.017 16H11.017C11.5693 16 12.017 15.5523 12.017 15V9C12.017 8.44772 11.5693 8 11.017 8H8.017C7.46472 8 7.017 8.44772 7.017 9V12C7.017 12.5523 6.5693 13 6.017 13H5.017V21H6.017Z" />
        </svg>
      </div>
      
      <div class="renderit-testimonial-content">
        <p>%content%</p>
      </div>
      
      <div class="renderit-testimonial-footer">
        %IF avatar%
        <div class="renderit-testimonial-avatar">
          <img src="%avatar%" alt="%name%">
        </div>
        %ENDIF%
        <div class="renderit-testimonial-info">
          <h4 class="renderit-testimonial-name">%name%</h4>
          <span class="renderit-testimonial-role">%role% %IF company%| %company%%ENDIF%</span>
        </div>
      </div>
      
      %IF rating%
      <div class="renderit-testimonial-stars" data-rating="%rating%">
        <!-- Stars injected by JS -->
      </div>
      %ENDIF%
    </div>
    %ENDFOREACH%
  </div>
</section>

<style>
  :root {
    --testi-bg: %design.colors.surface%;
    --testi-text: %design.colors.on-surface%;
    --testi-primary: %design.colors.primary%;
    --testi-accent: %design.colors.tertiary%;
    --testi-radius: %design.rounded.lg%;
  }

  .renderit-testimonials-section {
    padding: 60px 0;
  }

  .renderit-testimonials-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 30px;
    padding: 20px;
  }

  .renderit-testimonial-card {
    background: var(--testi-bg);
    color: var(--testi-text);
    padding: 40px;
    border-radius: var(--testi-radius);
    box-shadow: %design.elevation.md%;
    position: relative;
    display: flex;
    flex-direction: column;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .renderit-testimonial-card:hover {
    transform: translateY(-10px);
    box-shadow: %design.elevation.lg%;
  }

  .renderit-testimonial-quote-icon {
    color: var(--testi-primary);
    width: 40px;
    height: 40px;
    opacity: 0.2;
    margin-bottom: 20px;
  }

  .renderit-testimonial-content {
    font-size: 18px;
    line-height: 1.6;
    font-style: italic;
    margin-bottom: 30px;
    flex-grow: 1;
  }

  .renderit-testimonial-footer {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .renderit-testimonial-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--testi-primary);
  }

  .renderit-testimonial-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .renderit-testimonial-info {
    display: flex;
    flex-direction: column;
  }

  .renderit-testimonial-name {
    margin: 0;
    font-family: %design.fonts.primary%;
    font-size: 16px;
    font-weight: 700;
  }

  .renderit-testimonial-role {
    font-size: 14px;
    opacity: 0.7;
  }

  .renderit-testimonial-stars {
    margin-top: 15px;
    display: flex;
    gap: 2px;
    color: #ffc107;
  }

  .renderit-testimonial-star {
    width: 16px;
    height: 16px;
  }
</style>

<script>
(function() {
  const sectionId = 'renderit-testimonials-%INDEX%';
  const section = document.getElementById(sectionId);
  if (!section) return;

  const starContainers = section.querySelectorAll('.renderit-testimonial-stars');
  
  const starSvg = `
    <svg class="renderit-testimonial-star" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
    </svg>
  `;

  starContainers.forEach(container => {
    const rating = parseInt(container.getAttribute('data-rating')) || 5;
    container.innerHTML = starSvg.repeat(rating);
  });
})();
</script>
