<!-- Addon: timeline -->
<section id="renderit-timeline-%INDEX%" class="renderit-timeline-section">
  <div class="renderit-timeline-container">
    <div class="renderit-timeline-line"></div>
    
    %FOREACH timeline.items%
    <div class="renderit-timeline-item js-timeline-item %IF INDEX % 2 != 0%is-right%ELSE%is-left%ENDIF%">
      <div class="renderit-timeline-dot">
        %IF icon%
        <span class="renderit-timeline-icon">%icon%</span>
        %ELSE%
        <span class="renderit-timeline-dot-inner"></span>
        %ENDIF%
      </div>
      
      <div class="renderit-timeline-card">
        <div class="renderit-timeline-date">%date%</div>
        <h3 class="renderit-timeline-title">%title%</h3>
        <div class="renderit-timeline-content">
          %content%
        </div>
      </div>
    </div>
    %ENDFOREACH%
  </div>
</section>

<style>
  :root {
    --tl-line-color: rgba(0,0,0,0.1);
    --tl-primary: %design.colors.primary%;
    --tl-bg: %design.colors.surface%;
    --tl-text: %design.colors.on-surface%;
    --tl-radius: %design.rounded.md%;
  }

  .renderit-timeline-section {
    padding: 60px 20px;
    overflow: hidden;
  }

  .renderit-timeline-container {
    position: relative;
    max-width: 1000px;
    margin: 0 auto;
  }

  .renderit-timeline-line {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 100%;
    background: var(--tl-line-color);
    z-index: 1;
  }

  .renderit-timeline-item {
    position: relative;
    width: 50%;
    padding: 20px 40px;
    z-index: 2;
    opacity: 0;
    transition: all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
  }

  .renderit-timeline-item.is-left {
    left: 0;
    text-align: right;
    transform: translateX(-50px);
  }

  .renderit-timeline-item.is-right {
    left: 50%;
    text-align: left;
    transform: translateX(50px);
  }

  .renderit-timeline-item.is-visible {
    opacity: 1;
    transform: translateX(0);
  }

  .renderit-timeline-dot {
    position: absolute;
    top: 30px;
    width: 30px;
    height: 30px;
    background: var(--tl-primary);
    border-radius: 50%;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    box-shadow: 0 0 0 4px var(--tl-bg), 0 0 0 6px var(--tl-line-color);
  }

  .renderit-timeline-item.is-left .renderit-timeline-dot {
    right: -15px;
  }

  .renderit-timeline-item.is-right .renderit-timeline-dot {
    left: -15px;
  }

  .renderit-timeline-dot-inner {
    width: 8px;
    height: 8px;
    background: #fff;
    border-radius: 50%;
  }

  .renderit-timeline-icon svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }

  .renderit-timeline-card {
    background: var(--tl-bg);
    padding: 25px;
    border-radius: var(--tl-radius);
    box-shadow: %design.elevation.md%;
    position: relative;
  }

  .renderit-timeline-date {
    display: inline-block;
    font-size: 14px;
    font-weight: 700;
    color: var(--tl-primary);
    margin-bottom: 10px;
    background: rgba(0,0,0,0.03);
    padding: 4px 12px;
    border-radius: 20px;
  }

  .renderit-timeline-title {
    margin: 0 0 10px 0;
    font-family: %design.fonts.primary%;
    font-size: 20px;
    font-weight: 700;
  }

  .renderit-timeline-content {
    font-size: 15px;
    line-height: 1.6;
    opacity: 0.8;
  }

  @media (max-width: 768px) {
    .renderit-timeline-line {
      left: 30px;
      transform: none;
    }
    .renderit-timeline-item {
      width: 100%;
      left: 0 !important;
      padding-left: 70px;
      padding-right: 0;
      text-align: left !important;
      transform: translateX(30px);
    }
    .renderit-timeline-dot {
      left: 15px !important;
    }
  }
</style>

<script>
(function() {
  const containerId = 'renderit-timeline-%INDEX%';
  const container = document.getElementById(containerId);
  if (!container) return;

  const items = container.querySelectorAll('.js-timeline-item');
  
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.2 });

  items.forEach(item => observer.observe(item));
})();
</script>
