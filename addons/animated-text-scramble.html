<!-- Addon: animated-text-scramble -->
<div id="renderit-scramble-text-%id%" class="renderit-scramble-text-wrap"
     data-chars="%scramble_text.chars%"
     data-cursor="%scramble_text.cursor%"
     data-duration="%scramble_text.duration%"
     data-delay="%scramble_text.delay%">
  <div class="renderit-scramble-text-content">
    %scramble_text.content%
  </div>
</div>

<style>
  .renderit-scramble-text-wrap {
    font-family: %design.fonts.secondary%; /* Often used for code/scramble effects */
    font-size: %design.typography.body-lg.fontSize%;
    font-weight: 600;
    color: %design.colors.primary%;
    padding: 10px 0;
    min-height: 1.5em;
  }

  .renderit-scramble-text-content {
    display: inline-block;
  }
</style>

<script>
(function() {
  const containerId = 'renderit-scramble-text-%id%';
  
  function init() {
    const container = document.getElementById(containerId);
    const anime = window.anime;
    if (!container || !anime) return;

    const content = container.querySelector('.renderit-scramble-text-content');
    if (!content) return;

    const chars = container.getAttribute('data-chars') || '!<>-_\\/[]{}—=+*^?#________';
    const cursor = container.getAttribute('data-cursor') || '_';
    const duration = parseInt(container.getAttribute('data-duration')) || 2000;
    const delay = parseInt(container.getAttribute('data-delay')) || 0;
    const finalContent = content.textContent.trim();

    // The Scramble Engine
    const queue = [];
    for (let i = 0; i < finalContent.length; i++) {
      const from = '';
      const to = finalContent[i];
      // Randomly stagger the reveal per character
      const start = Math.random() * 0.5;
      const end = start + Math.random() * 0.5;
      queue.push({ from, to, start, end, char: '' });
    }

    function render(progress) {
      let output = '';
      let complete = 0;
      for (let i = 0, n = queue.length; i < n; i++) {
        let { from, to, start, end, char } = queue[i];
        if (progress >= end) {
          complete++;
          output += to;
        } else if (progress >= start) {
          if (!char || Math.random() < 0.28) {
            char = chars[Math.floor(Math.random() * chars.length)];
            queue[i].char = char;
          }
          output += `<span class="renderit-scramble-char">${char}</span>`;
        } else {
          output += from;
        }
      }
      content.innerHTML = output + (complete < queue.length ? `<span class="renderit-scramble-cursor">${cursor}</span>` : '');
    }

    // Trigger using Anime.js for precise timing
    setTimeout(() => {
      anime({
        targets: { progress: 0 },
        progress: 1,
        duration: duration,
        easing: 'linear',
        update: (anim) => {
          render(anim.animations[0].currentValue);
        }
      });
    }, delay || 100);
  }

  // Auto-init or retry if global anime is slow (though now it is in head)
  if (window.anime) {
    init();
  } else {
    const check = setInterval(() => {
      if (window.anime) {
        clearInterval(check);
        init();
      }
    }, 50);
  }
})();
</script>
