<!-- Addon: flipbox -->
<div id="renderit-flipbox-%INDEX%" class="renderit-flipbox-container">
  <div class="renderit-flipbox-inner">
    
    <!-- Front Side -->
    <div class="renderit-flipbox-front">
      %IF flipbox.front_icon%
      <div class="renderit-flipbox-icon">
        %flipbox.front_icon%
      </div>
      %ENDIF%
      <h3 class="renderit-flipbox-title">%flipbox.front_title%</h3>
    </div>

    <!-- Back Side -->
    <div class="renderit-flipbox-back">
      <h3 class="renderit-flipbox-title">%flipbox.back_title%</h3>
      <div class="renderit-flipbox-content">
        %flipbox.back_content%
      </div>
      %IF flipbox.back_cta_label%
      <a href="%flipbox.back_cta_url%" class="renderit-flipbox-cta">
        %flipbox.back_cta_label%
      </a>
      %ENDIF%
    </div>

  </div>
</div>

<style>
  :root {
    --flip-bg-front: %design.colors.surface%;
    --flip-bg-back: %design.colors.primary%;
    --flip-text-front: %design.colors.on-surface%;
    --flip-text-back: #ffffff;
    --flip-radius: %design.rounded.lg%;
  }

  .renderit-flipbox-container {
    background-color: transparent;
    width: 100%;
    height: 300px;
    perspective: 1000px;
    cursor: pointer;
  }

  .renderit-flipbox-inner {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
    box-shadow: %design.elevation.md%;
    border-radius: var(--flip-radius);
  }

  .renderit-flipbox-container:hover .renderit-flipbox-inner,
  .renderit-flipbox-container.is-flipped .renderit-flipbox-inner {
    transform: rotateY(180deg);
  }

  .renderit-flipbox-front, .renderit-flipbox-back {
    position: absolute;
    width: 100%;
    height: 100%;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    border-radius: var(--flip-radius);
    padding: 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .renderit-flipbox-front {
    background-color: var(--flip-bg-front);
    color: var(--flip-text-front);
  }

  .renderit-flipbox-back {
    background-color: var(--flip-bg-back);
    color: var(--flip-text-back);
    transform: rotateY(180deg);
  }

  .renderit-flipbox-icon {
    width: 60px;
    height: 60px;
    margin-bottom: 20px;
    color: %design.colors.primary%;
  }

  .renderit-flipbox-icon svg {
    width: 100%;
    height: 100%;
    fill: currentColor;
  }

  .renderit-flipbox-title {
    font-family: %design.fonts.primary%;
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 15px 0;
  }

  .renderit-flipbox-content {
    font-size: 16px;
    line-height: 1.5;
    margin-bottom: 20px;
    opacity: 0.9;
  }

  .renderit-flipbox-cta {
    display: inline-block;
    padding: 10px 20px;
    background: #ffffff;
    color: var(--flip-bg-back);
    border-radius: %design.rounded.md%;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    transition: transform 0.2s;
  }

  .renderit-flipbox-cta:hover {
    transform: scale(1.05);
  }
</style>

<script>
(function() {
  const containerId = 'renderit-flipbox-%INDEX%';
  const container = document.getElementById(containerId);
  if (!container) return;

  // Toggle for touch devices
  container.addEventListener('click', function() {
    this.classList.toggle('is-flipped');
  });
})();
</script>
