<!-- Addon: category-tabs -->
<div id="renderit-category-tabs-%id%" class="renderit-cat-tabs-container">
  
  <!-- Tabs Header -->
  <div class="renderit-cat-tabs-header">
    <div class="renderit-cat-tabs-list" role="tablist">
      
      %IF settings.show_all%
      <button class="renderit-cat-tab-btn is-active" data-filter="all" role="tab">
        %settings.show_all_label%
      </button>
      %ENDIF%

      %FOREACH categories%
      <button class="renderit-cat-tab-btn renderit-cat-filter-btn" 
              data-filter="%INDEX%" 
              role="tab">
        %title%
      </button>
      %ENDFOREACH%

    </div>
  </div>

  <!-- Cards Grid -->
  <div class="renderit-cat-cards-grid">
    %FOREACH categories%
    <div class="renderit-cat-group" data-category="%INDEX%">
      %FOREACH cards%
      <div class="renderit-cat-card">
        
        <div class="renderit-cat-card-media">
          <img src="%image%" alt="%title%">
          %IF badge%
          <span class="renderit-cat-card-badge">%badge%</span>
          %ENDIF%
        </div>

        <div class="renderit-cat-card-content">
          <div class="renderit-cat-card-header">
            <h3 class="renderit-cat-card-title">%title%</h3>
            %IF price%
            <span class="renderit-cat-card-price">%price%</span>
            %ENDIF%
          </div>

          %IF subtitle%
          <p class="renderit-cat-card-subtitle">%subtitle%</p>
          %ENDIF%

          %IF rating%
          <div class="renderit-cat-card-rating">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <span>%rating%</span>
          </div>
          %ENDIF%
        </div>
        
      </div>
      %ENDFOREACH%
    </div>
    %ENDFOREACH%
  </div>

</div>

<style>
  :root {
    --cat-tabs-primary: %design.colors.primary%;
    --cat-tabs-bg: %design.colors.surface%;
    --cat-tabs-card-bg: %design.colors.surface%;
    --cat-tabs-text: %design.colors.on-surface%;
    --cat-tabs-muted: rgba(0,0,0,0.5);
    --cat-tabs-border: rgba(0,0,0,0.1);
    --cat-tabs-radius: %design.rounded.md%;
  }

  .renderit-cat-tabs-container {
    width: 100%; /* % */
    display: flex;
    flex-direction: column;
    gap: 30px;
    font-family: %design.fonts.primary%;
  }

  /* Tabs List */
  .renderit-cat-tabs-header {
    display: flex;
    justify-content: center;
  }

  .renderit-cat-tabs-list {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    background: rgba(0,0,0,0.03);
    padding: 8px;
    border-radius: 50px;
  }

  .renderit-cat-tab-btn {
    background: transparent;
    border: none;
    padding: 10px 24px;
    border-radius: 40px;
    font-weight: 600;
    font-size: 15px;
    color: var(--cat-tabs-text);
    opacity: 0.7;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .renderit-cat-tab-btn:hover {
    opacity: 1;
  }

  .renderit-cat-tab-btn.is-active {
    background: var(--cat-tabs-primary);
    color: #ffffff;
    opacity: 1;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  /* Cards Grid */
  .renderit-cat-cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    width: 100%; /* % */
  }

  .renderit-cat-group {
    display: contents;
  }

  .renderit-cat-card {
    background: var(--cat-tabs-card-bg);
    border-radius: var(--cat-tabs-radius);
    border: 1px solid var(--cat-tabs-border);
    overflow: hidden;
    display: none;
    flex-direction: column;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    animation: renderitCatFadeIn 0.5s ease forwards;
  }

  .renderit-cat-card.is-visible {
    display: flex;
  }

  .renderit-cat-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.08);
  }

  .renderit-cat-card-media {
    position: relative;
    width: 100%; /* % */
    aspect-ratio: 4/3;
    overflow: hidden;
  }

  .renderit-cat-card-media img {
    width: 100%; /* % */
    height: 100%; /* % */
    object-fit: cover;
    transition: transform 0.5s ease;
  }

  .renderit-cat-card:hover .renderit-cat-card-media img {
    transform: scale(1.05);
  }

  .renderit-cat-card-badge {
    position: absolute;
    top: 15px;
    left: 15px;
    background: var(--cat-tabs-primary);
    color: #fff;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .renderit-cat-card-content {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .renderit-cat-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .renderit-cat-card-title {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    color: var(--cat-tabs-text);
    line-height: 1.3;
  }

  .renderit-cat-card-price {
    font-size: 18px;
    font-weight: 800;
    color: var(--cat-tabs-primary);
    white-space: nowrap;
  }

  .renderit-cat-card-subtitle {
    margin: 0;
    font-size: 14px;
    color: var(--cat-tabs-muted);
    line-height: 1.5;
  }

  .renderit-cat-card-rating {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: auto;
    font-size: 14px;
    font-weight: 600;
    color: #f59e0b; /* Golden Yellow for star */
  }

  .renderit-cat-card-rating span {
    color: var(--cat-tabs-text);
  }

  @keyframes renderitCatFadeIn {
    0% /* % */ { opacity: 0; transform: scale(0.95); }
    100% /* % */ { opacity: 1; transform: scale(1); }
  }

  @media (max-width: 768px) {
    .renderit-cat-cards-grid {
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    }
    .renderit-cat-tabs-list {
      flex-direction: row;
      border-radius: 12px;
      padding: 5px;
    }
    .renderit-cat-tab-btn {
      border-radius: 8px;
      padding: 8px 16px;
    }
  }
</style>

<script>
(function() {
  const containerId = 'renderit-category-tabs-%id%';
  const container = document.getElementById(containerId);
  if (!container) return;

  const buttons = container.querySelectorAll('.renderit-cat-tab-btn');
  const cards = container.querySelectorAll('.renderit-cat-card');
  const groups = container.querySelectorAll('.renderit-cat-group');

  // Initialize visibility based on whether "Show All" exists
  const showAllBtn = container.querySelector('[data-filter="all"]');
  let activeFilter = 'all';

  if (!showAllBtn && buttons.length > 0) {
    // If no show all button, set the first tab as active
    const firstTab = buttons[0];
    firstTab.classList.add('is-active');
    activeFilter = firstTab.getAttribute('data-filter');
  } else if (showAllBtn) {
    showAllBtn.classList.add('is-active');
  }

  function filterCards(filter) {
    groups.forEach(group => {
      const groupCat = group.getAttribute('data-category');
      const groupCards = group.querySelectorAll('.renderit-cat-card');
      
      groupCards.forEach(card => {
        card.classList.remove('is-visible');
        if (filter === 'all' || groupCat === filter) {
          setTimeout(() => {
            card.classList.add('is-visible');
          }, 10);
        }
      });
    });
  }

  // Initial filtering
  filterCards(activeFilter);

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      filterCards(btn.getAttribute('data-filter'));
    });
  });
})();
</script>
