<!-- Addon: team -->
<section id="renderit-team-%id%" class="renderit-team-section">
  <div class="renderit-team-grid">
    %FOREACH team.members%
    <div class="renderit-team-card">
      <div class="renderit-team-photo">
        <img src="%photo%" alt="%name%" loading="lazy">
        <div class="renderit-team-socials">
          %IF social_linkedin%
          <a href="%social_linkedin%" target="_blank" class="renderit-team-social-link" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
          </a>
          %ENDIF%
          %IF social_twitter%
          <a href="%social_twitter%" target="_blank" class="renderit-team-social-link" aria-label="Twitter">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.46 6c-.77.35-1.6.58-2.46.69.88-.53 1.56-1.37 1.88-2.38-.83.5-1.75.85-2.72 1.05C18.37 4.5 17.26 4 16 4c-2.35 0-4.27 1.92-4.27 4.29 0 .34.04.67.11.98C8.28 9.09 5.11 7.38 3 4.79c-.37.63-.58 1.37-.58 2.15 0 1.48.75 2.78 1.89 3.54-.7 0-1.36-.22-1.94-.54v.05c0 2.04 1.45 3.74 3.38 4.13-.35.09-.72.14-1.1.14-.27 0-.53-.02-.79-.07.53 1.65 2.06 2.85 3.88 2.89-1.43 1.12-3.23 1.78-5.18 1.78-.34 0-.67-.02-1-.06C3.12 20.21 5.4 21 7.84 21 15.81 21 20.17 14.4 20.17 8.67c0-.19 0-.37-.01-.56.84-.61 1.58-1.37 2.16-2.24z"/></svg>
          </a>
          %ENDIF%
          %IF social_instagram%
          <a href="%social_instagram%" target="_blank" class="renderit-team-social-link" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2m-.2 2A3.6 3.6 0 0 0 4 7.6v8.8A3.6 3.6 0 0 0 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6A3.6 3.6 0 0 0 16.4 4H7.6m5.4 2.8A4.2 4.2 0 0 1 17.2 11a4.2 4.2 0 0 1-4.2 4.2A4.2 4.2 0 0 1 8.8 11a4.2 4.2 0 0 1 4.2-4.2m0 2a2.2 2.2 0 0 0-2.2 2.2 2.2 2.2 0 0 0 2.2 2.2 2.2 2.2 0 0 0 2.2-2.2 2.2 2.2 0 0 0-2.2-2.2m5-2a1.2 1.2 0 0 1 1.2 1.2 1.2 1.2 0 0 1-1.2 1.2 1.2 1.2 0 0 1-1.2-1.2 1.2 1.2 0 0 1 1.2-1.2z"/></svg>
          </a>
          %ENDIF%
        </div>
      </div>
      <div class="renderit-team-info">
        <h3 class="renderit-team-name">%name%</h3>
        <span class="renderit-team-role">%role%</span>
        %IF bio%
        <p class="renderit-team-bio">%bio%</p>
        %ENDIF%
      </div>
    </div>
    %ENDFOREACH%
  </div>
</section>

<style>
  :root {
    --team-bg: %design.colors.surface%;
    --team-primary: %design.colors.primary%;
    --team-text: %design.colors.on-surface%;
    --team-radius: %design.rounded.lg%;
  }

  .renderit-team-section {
    padding: 60px 20px;
  }

  .renderit-team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 30px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .renderit-team-card {
    background: var(--team-bg);
    border-radius: var(--team-radius);
    overflow: hidden;
    box-shadow: %design.elevation.md%;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    display: flex;
    flex-direction: column;
  }

  .renderit-team-card:hover {
    transform: translateY(-10px);
    box-shadow: %design.elevation.lg%;
  }

  .renderit-team-photo {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
  }

  .renderit-team-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }

  .renderit-team-card:hover .renderit-team-photo img {
    transform: scale(1.1);
  }

  .renderit-team-socials {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 20px;
    background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    display: flex;
    justify-content: center;
    gap: 15px;
    transform: translateY(100%);
    transition: transform 0.3s ease;
  }

  .renderit-team-card:hover .renderit-team-socials {
    transform: translateY(0);
  }

  .renderit-team-social-link {
    color: #ffffff;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s, transform 0.2s;
  }

  .renderit-team-social-link:hover {
    color: var(--team-primary);
    transform: translateY(-3px);
  }

  .renderit-team-social-link svg {
    width: 20px;
    height: 20px;
  }

  .renderit-team-info {
    padding: 25px;
    text-align: center;
  }

  .renderit-team-name {
    margin: 0 0 5px 0;
    font-family: %design.fonts.primary%;
    font-size: 20px;
    font-weight: 700;
  }

  .renderit-team-role {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--team-primary);
    margin-bottom: 15px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .renderit-team-bio {
    font-size: 14px;
    line-height: 1.6;
    opacity: 0.7;
    margin: 0;
  }
</style>

</script>
