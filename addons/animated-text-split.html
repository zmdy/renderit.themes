<!-- Addon: animated-text-split -->
<div id="renderit-split-text-%id%" class="renderit-split-text-wrap" 
     data-effect="%split_text.effect%"
     data-duration="%split_text.duration%"
     data-delay="%split_text.delay%"
     data-easing="%split_text.easing%">
  <div class="renderit-split-text-content">
    %split_text.content%
  </div>
</div>

<style>
  .renderit-split-text-wrap {
    overflow: hidden;
    font-family: %design.fonts.primary%;
    font-size: %design.typography.h2.fontSize%;
    font-weight: %design.typography.h2.fontWeight%;
    color: %design.colors.on-surface%;
    line-height: 1.2;
    padding: 20px 0;
  }

  .renderit-split-text-content {
    opacity: 0; /* Hidden until anime.js initializes */
  }

  /* Specific styles for split effects */
  .renderit-split-text-wrap span {
    display: inline-block;
    will-change: transform, opacity;
  }
</style>

<script>
(function() {
  const containerId = 'renderit-split-text-%id%';
  
  function init() {
    const container = document.getElementById(containerId);
    const anime = window.anime;
    if (!container || !anime) return;

    const content = container.querySelector('.renderit-split-text-content');
    if (!content) return;

    const effect = container.getAttribute('data-effect') || 'chars';
    const duration = parseInt(container.getAttribute('data-duration')) || 1000;
    const delay = parseInt(container.getAttribute('data-delay')) || 50;
    const easing = container.getAttribute('data-easing') || 'easeOutExpo';

    // Internal Split Utility
    function split(el, type) {
      const text = el.textContent.trim();
      if (!text) return [];
      el.textContent = '';
      
      if (type === 'chars') {
        return text.split('').map(char => {
          const span = document.createElement('span');
          span.style.display = 'inline-block';
          span.textContent = char === ' ' ? '\u00A0' : char;
          el.appendChild(span);
          return span;
        });
      } else if (type === 'words') {
        return text.split(/\s+/).filter(Boolean).map(word => {
          const span = document.createElement('span');
          span.style.display = 'inline-block';
          span.style.marginRight = '0.25em';
          span.textContent = word;
          el.appendChild(span);
          return span;
        });
      }
      // lines fallback: treat whole element as one target
      return [el];
    }

    const rawEffect = effect.startsWith('%') ? 'chars' : effect; // fallback if template var didn't resolve
    const rawEasing = easing.startsWith('%') ? 'easeOutExpo' : easing;
    const targets = split(content, rawEffect);
    content.style.opacity = '1';

    if (!targets || targets.length === 0) {
      content.style.opacity = '1';
      console.warn('[Renderit split-text] No targets to animate. Check data-effect and content.');
      return;
    }

    // Trigger after a short delay to ensure element is in DOM
    setTimeout(() => {
      try {
        anime({
          targets: targets,
          translateY: [20, 0],
          opacity: [0, 1],
          duration: duration,
          delay: anime.stagger(delay),
          easing: rawEasing
        });
      } catch(e) {
        console.error('[Renderit split-text] Animation error:', e);
        content.style.opacity = '1';
      }
    }, 100);
  }

  if (window.anime) {
    init();
  } else {
    const check = setInterval(() => {
      if (window.anime) {
        clearInterval(check);
        init();
      }
    }, 50);
  }
})();
</script>
