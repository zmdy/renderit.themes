<!-- Addon: gallery -->
<div class="renderit-gallery-container" id="gallery-%id%">
  %IF title%
  <h2 class="renderit-gallery-main-title">%title%</h2>
  %ENDIF%

  <div class="renderit-gallery-grid" style="--gallery-cols: %settings.columns%; --gallery-gap: %settings.gap%;">
    %FOREACH items%
    <div class="renderit-gallery-item" data-index="%id%">
      <img src="%thumb%" data-full="%image%" alt="%caption%" class="renderit-gallery-img">
      <div class="renderit-gallery-overlay">
        <span class="renderit-gallery-caption">%caption%</span>
        <svg class="renderit-gallery-zoom" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </div>
    </div>
    %ENDFOREACH%
  </div>

  <!-- Lightbox -->
  <div class="renderit-gallery-lightbox">
    <div class="renderit-lightbox-overlay"></div>
    <div class="renderit-lightbox-content">
      <img src="" alt="" class="renderit-lightbox-img">
      <p class="renderit-lightbox-caption"></p>
      <button class="renderit-lightbox-close" aria-label="Fechar">&times;</button>
    </div>
  </div>
</div>

<style>
  #gallery-%id% {
    --gallery-primary: %design.colors.primary%;
    --gallery-surface: %design.colors.surface%;
    --gallery-radius: %design.rounded.md%;
    --gallery-font: %design.fonts.primary%;
  }

  #gallery-%id%.renderit-gallery-container {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    font-family: var(--gallery-font), sans-serif;
  }

  #gallery-%id% .renderit-gallery-main-title {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 2.5rem;
    font-weight: 700;
  }

  #gallery-%id% .renderit-gallery-grid {
    display: grid;
    grid-template-columns: repeat(var(--gallery-cols, 3), 1fr);
    gap: var(--gallery-gap, 1rem);
  }

  #gallery-%id% .renderit-gallery-item {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: var(--gallery-radius);
    overflow: hidden;
    cursor: pointer;
    background: #eee;
  }

  #gallery-%id% .renderit-gallery-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }

  #gallery-%id% .renderit-gallery-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s ease;
    color: white;
    padding: 1rem;
    text-align: center;
  }

  #gallery-%id% .renderit-gallery-item:hover .renderit-gallery-img {
    transform: scale(1.1);
  }

  #gallery-%id% .renderit-gallery-item:hover .renderit-gallery-overlay {
    opacity: 1;
  }

  #gallery-%id% .renderit-gallery-caption {
    font-weight: 600;
    margin-bottom: 0.5rem;
    transform: translateY(10px);
    transition: transform 0.3s ease;
  }

  #gallery-%id% .renderit-gallery-item:hover .renderit-gallery-caption {
    transform: translateY(0);
  }

  #gallery-%id% .renderit-gallery-zoom {
    width: 32px;
    height: 32px;
    fill: currentColor;
  }

  /* Lightbox */
  #gallery-%id% .renderit-gallery-lightbox {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  #gallery-%id% .renderit-gallery-lightbox.active {
    display: flex;
  }

  #gallery-%id% .renderit-lightbox-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(5px);
  }

  #gallery-%id% .renderit-lightbox-content {
    position: relative;
    z-index: 10001;
    max-width: 90%;
    max-height: 90%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #gallery-%id% .renderit-lightbox-img {
    max-width: 100%;
    max-height: 80vh;
    border-radius: 4px;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
    animation: zoomIn-%id% 0.3s ease;
  }

  #gallery-%id% .renderit-lightbox-caption {
    color: white;
    margin-top: 1rem;
    font-size: 1.1rem;
    font-weight: 500;
  }

  #gallery-%id% .renderit-lightbox-close {
    position: absolute;
    top: -40px;
    right: -40px;
    background: none;
    border: none;
    color: white;
    font-size: 3rem;
    cursor: pointer;
    line-height: 1;
  }

  @keyframes zoomIn-%id% {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  @media (max-width: 1024px) {
    #gallery-%id% .renderit-gallery-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 640px) {
    #gallery-%id% .renderit-gallery-grid { grid-template-columns: 1fr; }
    #gallery-%id% .renderit-lightbox-close { right: 0; top: -50px; }
  }
</style>

<script>
(function() {
  const container = document.getElementById('gallery-%id%');
  if (!container) return;

  const items = container.querySelectorAll('.renderit-gallery-item');
  const lightbox = container.querySelector('.renderit-gallery-lightbox');
  const lightboxImg = lightbox.querySelector('.renderit-lightbox-img');
  const lightboxCaption = lightbox.querySelector('.renderit-lightbox-caption');
  const closeBtn = lightbox.querySelector('.renderit-lightbox-close');
  const overlay = lightbox.querySelector('.renderit-lightbox-overlay');

  items.forEach(item => {
    item.addEventListener('click', () => {
      const img = item.querySelector('.renderit-gallery-img');
      const fullSrc = img.getAttribute('data-full');
      const caption = img.getAttribute('alt');

      lightboxImg.src = fullSrc;
      lightboxCaption.textContent = caption;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    });
  });

  const closeLightbox = () => {
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
    lightboxImg.src = '';
  };

  closeBtn.addEventListener('click', closeLightbox);
  overlay.addEventListener('click', closeLightbox);
  
  // Fechar com ESC
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
  });
})();
</script>
