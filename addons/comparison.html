<!-- Addon: comparison -->
<link rel="stylesheet" href="https://unpkg.com/image-compare-viewer/dist/image-compare-viewer.min.css">
<script src="https://unpkg.com/image-compare-viewer/dist/image-compare-viewer.min.js"></script>

<div class="renderit-comparison-container">
  <div id="renderit-comparison-%id%" class="image-compare">
    <img src="%comparison.before_image%" alt="%comparison.before_label%">
    <img src="%comparison.after_image%" alt="%comparison.after_label%">
  </div>
</div>

<style>
  .renderit-comparison-container {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    border-radius: %design.rounded.lg%;
    overflow: hidden;
    box-shadow: %design.elevation.md%;
  }

  .image-compare {
    width: 100%;
    aspect-ratio: 16 / 9;
  }

  /* Customizing the library UI to match Renderit Design */
  #renderit-comparison-%id% .icv__control-line {
    background: %design.colors.primary%;
    width: 2px;
  }

  #renderit-comparison-%id% .icv__circle-outer {
    border: 3px solid %design.colors.primary%;
    background: #fff;
  }

  #renderit-comparison-%id% .icv__label {
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    font-family: %design.fonts.primary%;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 700;
  }
</style>

<script>
(function() {
  const containerId = 'renderit-comparison-%id%';
  const container = document.getElementById(containerId);
  if (!container) return;

  // Initialize library
  const options = {
    controlColor: "%design.colors.primary%",
    controlShadow: true,
    addCircle: true,
    showLabels: true,
    labelOptions: {
      before: '%comparison.before_label%',
      after: '%comparison.after_label%',
      onHover: false
    },
    smoothing: true,
    smoothingAmount: 100
  };

  // Wait for library to be available in global scope
  const init = () => {
    if (typeof ImageCompare !== 'undefined') {
      new ImageCompare(container, options).mount();
    } else {
      setTimeout(init, 50);
    }
  };
  
  init();
})();
</script>
