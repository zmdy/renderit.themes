<!-- Addon: whatsapp -->
<div class="renderit-whatsapp-container pos-%whatsapp.settings.position%" id="whatsapp-%id%">
  <a href="https://wa.me/%whatsapp.number%?text=%whatsapp.message%" 
     class="renderit-whatsapp-link" 
     target="_blank" 
     rel="noopener noreferrer"
     aria-label="Falar no WhatsApp">
    
    %IF whatsapp.settings.show_label%

    </div>
  </a>
</div>

<style>
  :root {
    --whatsapp-color: #25D366;
    --whatsapp-font: %design.colors.on-surface%;
    --whatsapp-surface: %design.colors.surface%;
  }

  .renderit-whatsapp-container {
    z-index: 999;
    font-family: sans-serif;
  }

  /* Posicionamento */
  .renderit-whatsapp-container.pos-bottom-right { position: fixed; bottom: 25px; right: 25px; }
  .renderit-whatsapp-container.pos-bottom-left { position: fixed; bottom: 25px; left: 25px; }
  .renderit-whatsapp-container.pos-inline { position: relative; display: inline-block; }

  .renderit-whatsapp-link {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    transition: transform 0.3s ease;
  }

  .renderit-whatsapp-link:hover {
    transform: scale(1.05);
  }

  .renderit-whatsapp-label {
    background: var(--whatsapp-surface);
    color: var(--whatsapp-font);
    padding: 8px 16px;
    border-radius: 99px;
    font-size: 0.9rem;
    font-weight: 600;
    box-shadow: %design.elevation.md%;
    white-space: nowrap;
    opacity: 0;
    transform: translateX(10px);
    transition: all 0.3s ease;
  }

  .renderit-whatsapp-link:hover .renderit-whatsapp-label {
    opacity: 1;
    transform: translateX(0);
  }

  .renderit-whatsapp-icon-wrapper {
    position: relative;
    width: 60px;
    height: 60px;
    background: var(--whatsapp-color);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
  }

  .renderit-whatsapp-icon {
    width: 32px;
    height: 32px;
    fill: currentColor;
    z-index: 2;
  }

  .renderit-whatsapp-pulse {
    position: absolute;
    width: 100%;
    height: 100%;
    background: var(--whatsapp-color);
    border-radius: 50%;
    z-index: 1;
    opacity: 0.7;
    animation: whatsapp-pulse 2s infinite;
  }

  @keyframes whatsapp-pulse {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  /* Ajustes para posição inline */
  .renderit-whatsapp-container.pos-inline .renderit-whatsapp-label {
    opacity: 1;
    transform: none;
    box-shadow: none;
    border: 1px solid rgba(0,0,0,0.1);
  }

</style>

(function() {
  // Lógica simples de visibilidade se necessário
})();
</script>
